[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cylindrical-raytrace"
version = "0.1.0"
description = "2D ray tracing through concentric, zero-thickness cylindrical boundaries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
cylindrical-raytrace = "cylindrical_raytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
