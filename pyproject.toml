[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cylindrical-raytrace"
version = "0.2.0"
description = "2D optical and ultrasonic ray tracing through cylindrical media"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cylindrical-raytrace = "cylindrical_raytrace.cli:main"
ultrasonic-raytrace = "cylindrical_raytrace.ultrasonic_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
